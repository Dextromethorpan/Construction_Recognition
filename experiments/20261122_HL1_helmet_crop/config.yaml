# Study HL1_helmet_crop. POST-TEST (validation only). Written 2026-11-21 23:40 CET before running.
question: "Does a zoomed head crop beat the C0 crop for the helmet worn / not_worn head?"
hypothesis: "C0 (box 2x wide, 1.5x tall, squashed to 224) makes a helmet only a few pixels; a head crop (box width 1.0, rows from 0.15 h above the box top to 0.35 h below it, letterboxed) should raise helmet balanced accuracy by >= 0.05. Helmet kappa 0.89."
model: "same as judge.py heads: class-balanced L2 logistic regression on frozen yolo11n-cls 256-d + 6 geometry numbers, cutoff 0.5"
repeats: {seeds: [0,1,2,3,4], train_fraction_per_draw: 0.8}
primary: "helmet balanced accuracy, val_v2 + cs10k_dev labeled people, mean of 5 draws; also recall of not_worn (the violation) at that cutoff"
decision: ">= +0.05 and paired image-bootstrap CI > 0, else keep C0"
arms:
  - {name: HL0, change: "none (C0 crop)"}
  - {name: HL1, change: "head crop"}
  - {name: HL2, change: "info: C0 + head embeddings concatenated"}
